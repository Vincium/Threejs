<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#87ceeb" />
  <title>3D Forest — Three.js</title>
  <style>
    html, body {
      margin: 0; height: 100%; overflow: hidden; background: #87ceeb;
      touch-action: none; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      position: fixed; width: 100%;
    }
    canvas { display: block; touch-action: none; }
    #info {
      position: absolute; top: 10px; left: 10px;
      color: #fff; font-family: sans-serif; font-size: 12px;
      background: rgba(0, 0, 0, 0.4); padding: 6px 10px; border-radius: 6px;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="info">Click / WASD / arrows to look &amp; move • Q/E up-down</div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
